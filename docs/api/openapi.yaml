openapi: 3.1.0
info:
  title: S1 Arena API
  version: 1.0.0-draft.1
  summary: Read and drive betting, seasons, bot design and direct robot control.
  description: |
    The HTTP half of the S1 Arena API. The realtime half (seat control, spectating and the live feed) is
    specified in `asyncapi.yaml`; the concepts both share are explained in the guide (`README.md`).

    Every operation carries `x-status`:

    * `live`: the house server answers this today, at the path in `x-today`.
    * `partial`: the data is served today, but in a different shape or at a different path.
    * `proposed`: specified here, not built.

    Conventions: JSON only. Money is whole play-money credits. Prices are decimal odds in hundredths
    ("centi-odds": 235 is 2.35). Times are milliseconds since the Unix epoch unless a field says seconds or
    ticks. A tick is 1/60 s of simulated time.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8787/api/v1
    description: Local house server (`npm run dev`)
  - url: https://{host}/api/v1
    description: Deployed house server
    variables:
      host:
        default: arena.example
tags:
  - name: Meta
    description: Health, the rules catalog and the server clock.
  - name: Account
    description: Registration, the caller's profile and wallet, API keys and realtime tickets.
  - name: Seasons
    description: The house season. League table, fixtures, results and the fairness records behind every seed.
  - name: Design
    description: Bot builds. Check a build, read the stock builds, enter a bot into the next season.
  - name: Betting
    description: Markets, prices, bets and the public audit of the book.
  - name: Matches
    description: >-
      Matches you create and drive. Seats are filled by built-in brains, remote controllers, recorded inputs or
      nothing at all. Covers both clocks (realtime and lockstep), HTTP control for slow controllers, and replays.
  - name: Admin
    description: Driving the house season by hand. Needs the `admin` scope.
security: []

x-scopes:
  account: Read the caller's profile, wallet and bets.
  bets: Place bets.
  bots: Enter, replace or withdraw the caller's bot.
  drive: Create matches and control seats in them.
  admin: Advance the house season and set its clock.

paths:
  /health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Server health
      x-status: live
      x-today: GET /api/health
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok, jev, model]
                properties:
                  ok: { type: boolean, const: true }
                  jev: { type: boolean, description: True when the server holds a Jev key, so the `jev` brain can be used. }
                  model: { type: string, description: The Jev model id in use., examples: ["jev-latest"] }
                  engineVersion: { $ref: "#/components/schemas/EngineVersion" }

  /rules:
    get:
      tags: [Meta]
      operationId: getRules
      summary: The rules catalog
      description: |
        Every constant a client needs in order not to hard-code the game: the design catalog (weapon systems,
        parts, techniques, condition subjects, the budget), arena geometry and hazard timing, the season
        format, points and prize money, betting limits, and the limits on driven matches.

        The response is immutable for a given `rulesVersion`. Send `If-None-Match` to revalidate cheaply.
        Hazards are pure functions of fight time, so a deterministic controller can predict every pit opening
        and trap from `arena` alone.
      x-status: proposed
      x-today: Constants in shared/build.ts, src/sim/arena.ts, src/season/season.ts, src/account/prizes.ts, src/betting/book.ts
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: The catalog.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rules" }
        "304": { description: Not modified. }

  /time:
    get:
      tags: [Meta]
      operationId: getTime
      summary: Server clock
      description: >-
        For estimating clock offset before a realtime match. Over the seat socket use `ping` instead: it also
        returns the match tick.
      x-status: proposed
      responses:
        "200":
          description: The server's wall clock.
          content:
            application/json:
              schema:
                type: object
                required: [serverTime, tickRate]
                properties:
                  serverTime: { $ref: "#/components/schemas/Millis" }
                  tickRate: { type: integer, const: 60 }

  /users:
    post:
      tags: [Account]
      operationId: registerUser
      summary: Register a handle
      description: |
        Creates a user with a wallet of 1,000 credits and returns a bearer token. The token is shown once and
        only its hash is stored.

        Kept for development and for programmatic clients. Human sign-up is expected to move to OAuth (see
        Authentication in the guide); when it does, this route stays for scripts and the user id format does
        not change.
      x-status: live
      x-today: POST /api/bet/register
      x-rate-limit: 5 burst, then 1 per 20 s, per IP address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { $ref: "#/components/schemas/Handle" }
            example: { handle: "pit-boss" }
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required: [ok, userId, handle, token, balance]
                properties:
                  ok: { type: boolean, const: true }
                  userId: { $ref: "#/components/schemas/UserId" }
                  handle: { $ref: "#/components/schemas/Handle" }
                  token: { type: string, pattern: "^[0-9a-f]{64}$", description: The bearer token. Not retrievable later. }
                  balance: { $ref: "#/components/schemas/Credits" }
              example: { ok: true, userId: "u-3fa91c07b2d4", handle: "pit-boss", token: "9b1c4e079b1c4e079b1c4e079b1c4e079b1c4e079b1c4e079b1c4e079b1c4e07", balance: 1000 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The caller's profile
      x-status: live
      x-today: GET /api/bet/me
      security: [{ bearer: [account] }]
      responses:
        "200":
          description: Profile, balance, entered bot and the most recent 200 bets.
          content:
            application/json:
              schema:
                type: object
                required: [ok, userId, handle, balance, bot, bets]
                properties:
                  ok: { type: boolean, const: true }
                  userId: { $ref: "#/components/schemas/UserId" }
                  handle: { $ref: "#/components/schemas/Handle" }
                  balance: { $ref: "#/components/schemas/Credits" }
                  bot:
                    oneOf: [{ $ref: "#/components/schemas/BotEntry" }, { type: "null" }]
                  bets:
                    type: array
                    items: { $ref: "#/components/schemas/Bet" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/wallet:
    get:
      tags: [Account]
      operationId: getWallet
      summary: Wallet history
      description: >-
        The caller's side of the ledger, newest first: grants, stakes, payouts, refunds, prizes and stipends.
        Each row is one leg of a hash-chained ledger entry, so a client can reconcile it against `/audit`.
      x-status: proposed
      security: [{ bearer: [account] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of wallet rows.
          content:
            application/json:
              schema:
                type: object
                required: [ok, balance, items, nextCursor]
                properties:
                  ok: { type: boolean, const: true }
                  balance: { $ref: "#/components/schemas/Credits" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WalletRow" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/keys:
    get:
      tags: [Account]
      operationId: listKeys
      summary: List API keys
      x-status: proposed
      security: [{ bearer: [account] }]
      responses:
        "200":
          description: The caller's keys. Secrets are never returned here.
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok: { type: boolean, const: true }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Account]
      operationId: createKey
      summary: Create an API key
      description: |
        Mints a long-lived key for a script, a bot harness or a model. A key carries only the scopes asked
        for, so a betting bot's key cannot drive matches and a match harness cannot spend the wallet. Keys
        cannot mint keys, and no key may hold `admin`.
      x-status: proposed
      security: [{ bearer: [account] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/Scope" }
                expiresAt:
                  oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
            example: { name: "latency study", scopes: [drive] }
      responses:
        "200":
          description: Created. `secret` is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [ok, key, secret]
                properties:
                  ok: { type: boolean, const: true }
                  key: { $ref: "#/components/schemas/ApiKey" }
                  secret: { type: string, pattern: "^s1_[0-9a-f]{64}$" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me/keys/{keyId}:
    delete:
      tags: [Account]
      operationId: revokeKey
      summary: Revoke an API key
      description: Takes effect at once. Sockets opened with the key are closed.
      x-status: proposed
      security: [{ bearer: [account] }]
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ws-tickets:
    post:
      tags: [Account]
      operationId: createWsTicket
      summary: Get a one-time socket ticket
      description: >-
        Browsers cannot set an `Authorization` header on a WebSocket. A ticket is a single-use credential,
        valid for 30 seconds, passed as `?ticket=` when opening any socket in `asyncapi.yaml`. Clients that can
        set headers may send the bearer token on the upgrade request instead.
      x-status: proposed
      security: [{ bearer: [] }]
      responses:
        "200":
          description: A ticket.
          content:
            application/json:
              schema:
                type: object
                required: [ok, ticket, expiresAt]
                properties:
                  ok: { type: boolean, const: true }
                  ticket: { type: string }
                  expiresAt: { $ref: "#/components/schemas/Millis" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /seasons:
    get:
      tags: [Seasons]
      operationId: listSeasons
      summary: List seasons
      description: Newest first. Today the server keeps only the season in play; history starts when this ships.
      x-status: proposed
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of season summaries.
          content:
            application/json:
              schema:
                type: object
                required: [ok, items, nextCursor]
                properties:
                  ok: { type: boolean, const: true }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SeasonSummary" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }

  /seasons/simulate:
    post:
      tags: [Seasons]
      operationId: simulateSeason
      summary: Simulate a whole season
      description: |
        Stateless. Runs a full ten-match season for eight builds on built-in brains and returns every record.
        Nothing is stored, no markets open and no money moves. About 100 ms of one core. This is the same
        code path the house uses to price a season, so it is the honest way for a bettor to build their own
        model.
      x-status: proposed
      x-today: scripts/season-sim.ts (createSeason + simulateNext)
      x-rate-limit: 10 burst, then 1 per 5 s, per user
      security: [{ bearer: [drive] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entrants]
              properties:
                entrants:
                  type: array
                  minItems: 8
                  maxItems: 8
                  items: { $ref: "#/components/schemas/BotSource" }
                seed: { type: integer, minimum: 0, maximum: 999999, description: Omit for a random seed. }
                brain: { $ref: "#/components/schemas/BuiltinBrain" }
      responses:
        "200":
          description: The finished season.
          content:
            application/json:
              schema:
                type: object
                required: [ok, season]
                properties:
                  ok: { type: boolean, const: true }
                  season: { $ref: "#/components/schemas/Season" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /seasons/{seasonId}:
    get:
      tags: [Seasons]
      operationId: getSeason
      summary: Read a season
      description: |
        `seasonId` is an id such as `s12`, or the word `current` for the season in play.

        The response is everything a spectator or a bettor needs in one read: phase, table, entrants, the
        round now open, the match clock and whether a pricing run is in hand. `markets` lists the open and
        suspended markets, with prices personalised to the caller when a token is sent (`maxStake` reflects
        the caller's balance and limits).
      x-status: partial
      x-today: GET /api/bet/season (current season only)
      security: [{}, { bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: The season.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /seasons/{seasonId}/standings:
    get:
      tags: [Seasons]
      operationId: getStandings
      summary: League table
      x-status: partial
      x-today: "`table` in GET /api/bet/season (rank, played, points, wins only)"
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: The table, top first.
          content:
            application/json:
              schema:
                type: object
                required: [ok, seasonId, standings]
                properties:
                  ok: { type: boolean, const: true }
                  seasonId: { $ref: "#/components/schemas/SeasonIdValue" }
                  standings:
                    type: array
                    items: { $ref: "#/components/schemas/Standing" }
        "404": { $ref: "#/components/responses/NotFound" }

  /seasons/{seasonId}/entrants:
    get:
      tags: [Seasons]
      operationId: listEntrants
      summary: Entrants and their builds
      description: |
        The eight bots in the league with the builds frozen at season start. Builds are public from that
        moment: a match cannot be replayed, and a seed cannot be checked, without them. A designer's later
        edits are not shown until they are frozen into the next season.
      x-status: partial
      x-today: "`entrants` in GET /api/bet/season (no builds)"
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: The entrants in entry order.
          content:
            application/json:
              schema:
                type: object
                required: [ok, seasonId, entrants]
                properties:
                  ok: { type: boolean, const: true }
                  seasonId: { $ref: "#/components/schemas/SeasonIdValue" }
                  entrants:
                    type: array
                    items: { $ref: "#/components/schemas/Entrant" }
        "404": { $ref: "#/components/responses/NotFound" }

  /seasons/{seasonId}/fixtures:
    get:
      tags: [Seasons]
      operationId: listFixtures
      summary: Fixtures and results
      description: >-
        All fixtures scheduled so far, in playing order. The Last Chance and Grand Final fixtures appear once
        their line-ups are known. A played fixture carries its record.
      x-status: partial
      x-today: "`round` in GET /api/bet/season (the open round only, no records)"
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - name: stage
          in: query
          schema: { $ref: "#/components/schemas/Stage" }
        - name: played
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Fixtures.
          content:
            application/json:
              schema:
                type: object
                required: [ok, seasonId, fixtures]
                properties:
                  ok: { type: boolean, const: true }
                  seasonId: { $ref: "#/components/schemas/SeasonIdValue" }
                  fixtures:
                    type: array
                    items: { $ref: "#/components/schemas/FixtureView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /seasons/{seasonId}/fixtures/{fixtureId}:
    get:
      tags: [Seasons]
      operationId: getFixture
      summary: One fixture
      x-status: proposed
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - name: fixtureId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/FixtureId" }
      responses:
        "200":
          description: The fixture, its record if played, and its fairness record.
          content:
            application/json:
              schema:
                type: object
                required: [ok, fixture]
                properties:
                  ok: { type: boolean, const: true }
                  fixture: { $ref: "#/components/schemas/FixtureView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /seasons/{seasonId}/fairness:
    get:
      tags: [Seasons]
      operationId: getFairness
      summary: Seed commitments
      description: |
        One record per fixture whose markets have opened. Before betting closes a record shows only `commit`.
        At lock the house reveals `secret`, takes `anchor` from the ledger head, and the match seed follows:

        ```
        commit = sha256("s1-commit|" + seasonId + "|" + fixtureId + "|" + secret)
        seed   = first 32 bits of sha256("s1-seed|" + secret + "|" + anchor)
        ```

        With the seed and the entrants' builds, `GET /matches/{matchId}/replay` lets anyone re-run the match.
      x-status: live
      x-today: "`fairness` in GET /api/bet/season"
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: Fairness records.
          content:
            application/json:
              schema:
                type: object
                required: [ok, seasonId, fairness]
                properties:
                  ok: { type: boolean, const: true }
                  seasonId: { $ref: "#/components/schemas/SeasonIdValue" }
                  fairness:
                    type: array
                    items: { $ref: "#/components/schemas/FairRecord" }
        "404": { $ref: "#/components/responses/NotFound" }

  /builds/stock:
    get:
      tags: [Design]
      operationId: listStockBuilds
      summary: Stock builds
      description: >-
        The seven house builds, one per weapon system, complete with their rule trees and Jev prompts. Start a
        design from one of these: `PUT /me/bot` fills anything a submitted build leaves out from the stock
        build of the same `kind`.
      x-status: proposed
      x-today: stockBuild() in shared/bots/index.ts
      responses:
        "200":
          description: The stock builds.
          content:
            application/json:
              schema:
                type: object
                required: [ok, builds]
                properties:
                  ok: { type: boolean, const: true }
                  builds:
                    type: array
                    items: { $ref: "#/components/schemas/BotBuild" }

  /builds/check:
    post:
      tags: [Design]
      operationId: checkBuild
      summary: Check a build
      description: |
        Stateless. Normalises a build exactly as entry does, then returns the normalised build, its cost
        against the budget, the stats the simulation derives from it, and every problem found. Errors block
        entry; warnings do not. Use it as the inner loop of a design optimiser.
      x-status: proposed
      x-today: normalizeBuild, costOf, derive and validateBuild in shared/build.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [build]
              properties:
                build: { $ref: "#/components/schemas/BotBuildInput" }
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema:
                type: object
                required: [ok, legal, build, cost, derived, problems]
                properties:
                  ok: { type: boolean, const: true }
                  legal: { type: boolean, description: True when there are no problems at level `error`. }
                  build: { $ref: "#/components/schemas/BotBuild" }
                  cost: { $ref: "#/components/schemas/Cost" }
                  derived: { $ref: "#/components/schemas/Derived" }
                  problems:
                    type: array
                    items: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me/bot:
    get:
      tags: [Design]
      operationId: getMyBot
      summary: The caller's entered bot
      x-status: live
      x-today: GET /api/bet/bot
      security: [{ bearer: [account] }]
      responses:
        "200":
          description: The entry, or null.
          content:
            application/json:
              schema:
                type: object
                required: [ok, bot]
                properties:
                  ok: { type: boolean, const: true }
                  bot:
                    oneOf: [{ $ref: "#/components/schemas/BotEntry" }, { type: "null" }]
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Design]
      operationId: enterBot
      summary: Enter or replace the caller's bot
      description: |
        One bot per user. Entries are frozen into a season when it starts: the designers who have waited
        longest go first and the house's stock bots and wildcards fill the rest of the league of eight. An
        edit made mid-season plays from the next season (`playing.current` turns false).

        A designed bot pays its designer prize money into the wallet they bet from (see `prizes` in `/rules`).

        Rejected when the callsign is malformed, belongs to a house bot or to another designer, the build is
        over budget, lacks Engage, or installs a technique its weapon cannot use.
      x-status: live
      x-today: PUT /api/bet/bot
      x-rate-limit: 20 burst, then 1 per 5 s, per user
      security: [{ bearer: [bots] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [build]
              properties:
                build: { $ref: "#/components/schemas/BotBuildInput" }
            example:
              build:
                name: "TIN OPENER"
                kind: saw
                tagline: "Finds the seam."
                levels: { armor: 1, motor: 4, frame: 2, steering: 3, power: 3, cycle: 2, wedge: 0, traction: 1, gyro: 0, sensors: 2 }
                techniques: [engage, retreat, flank, spin_up]
      responses:
        "200":
          description: Entered.
          content:
            application/json:
              schema:
                type: object
                required: [ok, bot]
                properties:
                  ok: { type: boolean, const: true }
                  bot: { $ref: "#/components/schemas/BotEntry" }
        "400":
          description: The build was rejected. `problems` lists everything wrong; `error` is the first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      problems:
                        type: array
                        items: { type: string }
              example: { ok: false, code: bad_request, error: "3 points over the 60-point budget", problems: ["3 points over the 60-point budget"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Design]
      operationId: withdrawBot
      summary: Withdraw the caller's bot
      description: Removes it from future seasons. A copy already frozen into the season in play finishes that season.
      x-status: live
      x-today: DELETE /api/bet/bot
      security: [{ bearer: [bots] }]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [ok, withdrawn]
                properties:
                  ok: { type: boolean, const: true }
                  withdrawn: { type: boolean, description: False when there was no entry. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /markets:
    get:
      tags: [Betting]
      operationId: listMarkets
      summary: Markets and live prices
      description: |
        Markets of the season in play, filtered. Market ids contain `/` (for example `s12/w1a/win`), so markets
