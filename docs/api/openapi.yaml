      operationId: stepMatch
      summary: Advance a lockstep match
      description: |
        The whole control loop in one call, in the style of a reinforcement-learning environment: submit
        inputs for the seats you hold, advance, and get back what happened.

        The match advances `ticks` ticks (default: the match's `stepTicks`) once every remote seat has
