        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  description: Keyed by seat index. Seats you hold and leave out keep their last input.
                  additionalProperties:
                    type: object
                    properties:
                      control: { $ref: "#/components/schemas/ControlFrame" }
                      intent: { $ref: "#/components/schemas/IntentInput" }
